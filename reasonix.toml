t('...')\n\")", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 -c \"\nimport json\n# Read a lora args.json\nwith open('exps/COST2100/in/lora/seed2026/transnet_hybrid_token_projection_rank8_alpha16/args.json') as f:\n    print(json.dumps(json.load(f), indent=2))\n\")", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 -c \"\nimport json\n# Read seed42 hybrid args to see difference\nwith open('exps/COST2100/in/seed42/cnn_hybrid/base/args.json') as f:\n    print(json.dumps(json.load(f), indent=2))\n\")", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 -c \"\nimport os, glob, re\n\nbase = 'exps/COST2100/in/seed42'\n\n# Full NMSE matrix for 14 encoders × 3 decoders\nencoders = []\ndecoders = []\ndata = {}\n\nfor d in sorted(glob.glob(f'{base}/*/*/run.log')):\n    # extract encoder and decoder from path\n    parts = d.replace(base+'/', '').split('/')\n    # e.g., 'attention_cnn_hybrid/base/run.log' -> encoder='attention_cnn', decoder='hybrid'\n    name_parts = parts[0].rsplit('_', 1)\n    if len(name_parts) < 2:\n        continue\n    # actually the pattern is: {encoder_name}_{decoder_name}\n    # known decoders: hybrid, transnet, cnn_residual\n    for dec in ['_hybrid', '_transnet', '_cnn_residual']:\n        if parts[0].endswith(dec):\n            enc = parts[0][:-len(dec)]\n            dec_name = dec[1:]\n            break\n    else:\n        continue\n    \n    with open(d) as f:\n        content = f.read()\n    m = re.search(r'=> Test NMSE: (-?\\d+\\.\\d+e[+-]?\\d+)', content)\n    if m:\n        nmse = float(m.group(1))\n        data[(enc, dec_name)] = nmse\n\nencoders = sorted(set(k[0] for k in data))\ndecoders = ['transnet', 'cnn_residual', 'hybrid']\n\n# Print matrix\nprint(f'{\\\"Encoder\\\":25s}', end='')\nfor dec in decoders:\n    print(f'{dec:>18s}', end='')\nprint()\nprint('-' * 80)\nfor enc in encoders:\n    print(f'{enc:25s}', end='')\n    for dec in decoders:\n        val = data.get((enc, dec))\n        if val is not None:\n            print(f'{val:>18.2f}', end='')\n        else:\n            print(f'{\\\"N/A\\\":>18s}', end='')\n    print()\n\")", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 -c \"\nimport os, glob, re\n\nbase = 'exps/COST2100/in/frozen_decoder'\n\nprint('=== Frozen Decoder Hybrid (all seeds × all architectures) ===')\ndata = []\nfor seed_dir in sorted(glob.glob(f'{base}/seed*/')):\n    seed = os.path.basename(seed_dir.rstrip('/'))\n    for exp_dir in sorted(glob.glob(f'{seed_dir}*/')):\n        name = os.path.basename(exp_dir.rstrip('/'))\n        if not name.endswith('_hybrid') and name != 'transnet_hybrid':\n            continue\n        log = os.path.join(exp_dir, 'run.log')\n        if os.path.exists(log):\n            with open(log) as f:\n                content = f.read()\n            m = re.search(r'=> Test NMSE: (-?\\d+\\.\\d+e[+-]?\\d+)', content)\n            if m:\n                nmse = float(m.group(1))\n                # extract encoder name\n                enc = name.replace('_hybrid', '')\n                data.append((seed, enc, nmse))\n\n# Print as matrix\nseeds = sorted(set(d[0] for d in data))\nencs = sorted(set(d[1] for d in data), key=lambda x: (len(x), x))\nprint(f'{\\\"Encoder\\\":25s}', end='')\nfor s in seeds:\n    print(f'{s:>12s}', end='')\nprint()\nprint('-' * 75)\nfor enc in encs:\n    print(f'{enc:25s}', end='')\n    for s in seeds:\n        vals = [d[2] for d in data if d[0] == s and d[1] == enc]\n        if vals:\n            print(f'{vals[0]:>12.2f}', end='')\n        else:\n            print(f'{\\\"N/A\\\":>12s}', end='')\n    print()\n\")", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && cat exps/COST2100/in/seed42/codeword_analysis/summary_report.md)", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 -c \"\nimport os, re\n\n# Check the seed2026 and seed3407 non-frozen experiments - which args do they have?\nimport json\nfor seed in ['seed2026', 'seed3407']:\n    for exp in os.li
ist.mean():.6f}\")\n\n# ---- 4. Within-seed vs across-seed variance ----\noverall_mean = all_data.mean(axis=(0,1), keepdims=True)\nbetween_var = ((centroids - overall_mean.squeeze())**2).sum() / n_seeds\nwithin_var = 0\nfor s in seeds:\n    within_var += ((data[s] - data[s].mean(axis=0, keepdims=True))**2).sum()\nwithin_var /= (n_seeds * N)\ntotal_var = ((all_data - overall_mean)**2).sum() / (n_seeds * N)\nprint(f\"\\n=== Variance decomposition ===\")\nprint(f\"  Total variance: {total_var:.6f}\")\nprint(f\"  Between-seed variance: {between_var:.6f} ({between_var/total_var*100:.2f}%)\")\nprint(f\"  Within-seed variance: {within_var:.6f} ({within_var/total_var*100:.2f}%)\")\n\n# ---- 5. Effective rank for first few seeds ----\nprint(f\"\\n=== Effective rank (first 5 seeds, out of {D} dims) ===\")\nfor s in seeds[:5]:\n    x = data[s]\n    U, S, Vt = np.linalg.svd(x - x.mean(axis=0, keepdims=True), full_matrices=False)\n    var_expl = np.cumsum(S**2) / (S**2).sum()\n    eff_rank_90 = int(np.searchsorted(var_expl, 0.90))\n    eff_rank_95 = int(np.searchsorted(var_expl, 0.95))\n    eff_rank_99 = int(np.searchsorted(var_expl, 0.99))\n    print(f\"  seed{s}: 90%={eff_rank_90}, 95%={eff_rank_95}, 99%={eff_rank_99}\")\n\nPYEOF)", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 << 'PYEOF'\nimport torch\nimport numpy as np\nimport os\nfrom collections import OrderedDict\n\nBASE = \"exps/COST2100/in\"\nseed_dirs = sorted([d for d in os.listdir(BASE) if d.startswith(\"seed\")])\nseeds = [d.replace(\"seed\",\"\") for d in seed_dirs]\nn_seeds = len(seeds)\nprint(f\"Total seeds: {n_seeds}\")\n\n# Load first seed to get dims\nd0 = torch.load(f\"{BASE}/seed{seeds[0]}/transnet_hybrid/codewords/train_code.pt\", weights_only=True).float().numpy()\nN, D = d0.shape\nprint(f\"Each: {N} samples x {D} dims\")\n\n# For basic stats, sample: use all seeds but take a random subset of samples\nnp.random.seed(42)\nSAMPLE = 5000  # 5% of data per seed\n\nstats_list = []\ncentroids = np.zeros((n_seeds, D))\nsampled_data = []  # store sampled data for cross-seed analysis\n\nfor i, sid in enumerate(seeds):\n    x = torch.load(f\"{BASE}/seed{sid}/transnet_hybrid/codewords/train_code.pt\", weights_only=True).float().numpy()\n    \n    # Basic stats\n    stats_list.append({\n        \"mean\": float(x.mean()),\n        \"std\": float(x.std()),\n        \"min\": float(x.min()),\n        \"max\": float(x.max()),\n        \"median\": float(np.median(x)),\n    })\n    \n    centroids[i] = x.mean(axis=0)\n    \n    # Subsample for cross analysis\n    idx = np.random.choice(N, SAMPLE, replace=False)\n    sampled_data.append(x[idx])\n\n# Summary stats\nprint(\"\\n=== 基本统计量 (Basic Stats) ===\")\nfor key in [\"mean\", \"std\", \"min\", \"max\", \"median\"]:\n    vals = [s[key] for s in stats_list]\n    print(f\"  {key}: min={min(vals):.6f}, max={max(vals):.6f}, mean={np.mean(vals):.6f}, std={np.std(vals):.6f}\")\n\n# Histogram of mean values\nmeans = [s[\"mean\"] for s in stats_list]\nprint(f\"\\n  均值分布: min={min(means):.6f}, max={max(means):.6f}, range={max(means)-min(means):.6f}\")\n\n# ---- Centroid analysis ----\nprint(\"\\n=== 质心分析 (Centroid Analysis) ===\")\ncentroid_norms = np.linalg.norm(centroids, axis=1)\nprint(f\"  Centroid norms: min={centroid_norms.min():.6f}, max={centroid_norms.max():.6f}, mean={centroid_norms.mean():.6f}, std={centroid_norms.std():.6f}\")\n\n# Pairwise centroid Euclidean distance\nn_seeds_show = min(10, n_seeds)\nprint(f\"\\n  First {n_seeds_show} seed centroid L2 norms: {np.round(centroid_norms[:n_seeds_show], 4)}\")\n\ncentroid_dist = np.zeros((n_seeds, n_seeds))\nfor i in range(n_seeds):\n    for j in range(i+1, n_seeds):\n        d_ij = np.linalg.norm(centroids[i] - centroids[j])\n        centroid_dist[i,j] = centroid_dist[j,i] = d_ij\noff_diag_dist = centroid_dist[np.triu_indices_from(centroid_dist, 1)]\nprint(f\"  质心pairwise L2距离: min={off_diag_dist.min():.6f}, max={off_diag_dist.max():.6f}, mean={off_diag_dist.mean():.6f}, std={off_diag_dist.std():.6f}\")\n\n# Normalized centroid cosine similarity\ncn = centroids / (centroid_norms[:, None] + 1e-12)\ncos_sim = cn @ cn.T\noff_diag_cos = cos_sim[np.triu_indices_from(cos_sim, 1)]\nprint(f\"  质心pairwise cosine相似度: min={off_diag_cos.min():.6f}, max={off_diag_cos.max():.6f}, mean={off_diag_cos.mean():.6f}, std={off_diag_cos.std():.6f}\")\n\n# ---- Centroid angles ----\nprint(f\"\\n  Top-5 most similar seed pairs (cosine):\")\nflat_idx = np.argsort(-cos_sim, axis=None)\nfor k in range(5):\n    idx = flat_idx[k]\n    i, j = divmod(idx, n_seeds)\n    if i < j:\n        print(f\"    seed{seeds[i]}-seed{seeds[j]}: {cos_sim[i,j]:.6f}\")\n\nprint(f\"  Top-5 most different seed pairs (cosine):\")\nflat_idx = np.argsort(cos_sim, axis=None)\nfor k in range(5):\n    idx = flat_idx[k]\n    i, j = divmod(idx, n_seeds)\n    if i < j:\n        print(f\"    seed{seeds[i]}-seed{seeds[j]}: {cos_sim[i,j]:.6f}\")\n\n# ---- Variance decomposition ----\nprint(\"\\n=== 方差分解 (Variance Decomposition) ===\")\noverall_mean = np.mean(centroids, axis=0, keepdims=True)  # population mean\nbetween_var = np.mean((centroids - overall_mean)**2)\n# For within var, use sampled data\nwithin_vars = []\nfor i in range(n_seeds):\n    within_vars.append(np.mean((sampled_data[i] - sampled_data[i].mean(axis=0, keepdims=True))**2))\nwithin_var = np.mean(within_vars)\ntotal_var = np.mean([np.mean((sampled_data[i] - overall_mean)**2) for i in range(n_seeds)])\nprint(f\"  Total variance: {total_var:.6f}\")\nprint(f\"  Between-seed variance: {between_var:.6f} ({between_var/total_var*100:.2f}%)\")\nprint(f\"  Within-seed variance: {within_var:.6f} ({within_var/total_var*100:.2f}%)\")\n\n# ---- Per-dimension statistics ----\nprint(\"\\n=== 逐维度统计 ===\")\nall_sampled = np.concatenate(sampled_data, axis=0)  # [n_seeds*SAMPLE, D]\ndim_means = all_sampled.mean(axis=0)\ndim_stds = all_sampled.std(axis=0)\nprint(f\"  dim均值: min={dim_means.min():.6f}, max={dim_means.max():.6f}, mean={dim_means.mean():.6f}\")\nprint(f\"  dim标准差: min={dim_stds.min():.6f}, max={dim_stds.max():.6f}, mean={dim_stds.mean():.6f}\")\nprint(f\"  维度间均值的变化范围: {dim_means.max()-dim_means.min():.6f}\")\n\n# ---- Check: are different seeds just rotated/scaled versions? ----\n# Compute the correlation between centroids and subspace alignment\nprint(\"\\n=== 子空间对齐 (Subspace Alignment) ===\")\n# Use first 2 seeds, compute their principal subspaces\nfrom sklearn.decomposition import PCA as SKPCA\npca_seeds = []\nfor i in range(min(3, n_seeds)):\n    pca = SKPCA(n_components=min(50, D))\n    pca.fit(sampled_data[i])\n    pca_seeds.append(pca.components_.T)  # [D, 50]\n\n# Subspace similarity: principal angles via canonical correlation\nfor i in range(min(3, n_seeds)):\n    for j in range(i+1, min(3, n_seeds)):\n        # Compute canonical correlations between subspaces\n        A = pca_seeds[i]  # [D, k]\n        B = pca_seeds[j]  # [D, k]\n        # SVD of A^T B\n        Ua, Sa, Va = np.linalg.svd(A.T @ B)\n        # Principal angles = arccos(Sa)\n        angles = np.arccos(np.clip(Sa, -1, 1))\n        print(f\"  seed{seeds[i]}-seed{seeds[j]} principal angles (first 10): {np.round(angles[:10], 4)}\")\n        print(f\"    mean principal angle: {np.mean(angles):.4f} rad = {np.degrees(np.mean(angles)):.2f} deg\")\n        print(f\"    min principal angle: {angles[0]:.4f} rad = {np.degrees(angles[0]):.2f} deg\")\n\nPYEOF)", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 << 'PYEOF'\nimport torch\nimport numpy as np\nimport os\nfrom collections import OrderedDict\n\nBASE = \"exps/COST2100/in\"\nseed_dirs = sorted([d for d in os.listdir(BASE) if d.startswith(\"seed\")])\nseeds = [d.replace(\"seed\",\"\") for d in seed_dirs]\nn_seeds = len(seeds)\n\n# Load subsampled\nnp.random.seed(42)\nSAMPLE = 5000\nN = 100000\nD = 512\n\nsampled_data = {}\nfor sid in seeds:\n    x = torch.load(f\"{BASE}/seed{sid}/transnet_hybrid/codewords/train_code.pt\", weights_only=True).float().numpy()\n    idx = np.random.choice(N, SAMPLE, replace=False)\n    sampled_data[sid] = x[idx]\n\n# ---- Additional analyses ----\n\n# 1. Check: can we align codewords via simple linear transformation?\n# Take seed42 as reference, compute optimal linear map from other seeds to seed42\nprint(\"=== 线性可对齐性测试 (Test: can a linear transform align codewords?) ===\")\nref_seed = seeds[0]\nref_data = sampled_data[ref_seed]  # [5000, 512]\n\nfor target_idx in [1, 2, 5, 10, 30]:\n    t_seed = seeds[target_idx]\n    t_data = sampled_data[t_seed]\n    \n    # Ridge regression: find W that maps t_data -> ref_data\n    # W = (X^T X + lambda I)^-1 X^T Y\n    lam = 1e-3\n    X = t_data\n    Y = ref_data\n    XtX = X.T @ X + lam * np.eye(D)\n    XtY = X.T @ Y\n    W = np.linalg.solve(XtX, XtY)\n    \n    # Apply transformation\n    pred = X @ W\n    mse = np.mean((pred - Y)**2)\n    var_y = np.var(Y)\n    r2 = 1 - mse / var_y\n    \n    # Also test on a held-out subset\n    idx_test = np.random.choice(SAMPLE, 1000, replace=False)\n    pred_test = X[idx_test] @ W\n    mse_test = np.mean((pred_test - Y[idx_test])**2)\n    r2_test = 1 - mse_test / var_y\n    \n    print(f\"  seed{ref_seed} <- seed{t_seed}: R2_train={r2:.4f}, R2_test={r2_test:.4f}\")\n\nprint(\"\\n  → If R2 close to 1, seeds differ by a near-linear transform. R2 near 0 means fundamentally different spaces.\")\n\n# 2. Check: Are the codeword dimensions \"specialized\"? \n# I.e., do some dimensions consistently have large magnitude across all samples?\nprint(\"\\n=== 维度重要性模式 (Dimension Importance Pattern) ===\")\n# Compute per-dimension variance for each seed, then check cross-seed correlation\ndim_var_mat = np.zeros((n_seeds, D))\nfor i, sid in enumerate(seeds):\n    dim_var_mat[i] = np.var(sampled_data[sid], axis=0)\n\n# Correlation of dimension variance profiles between seeds\nfrom scipy.stats import spearmanr\nvar_corrs = []\nfor i in range(min(20, n_seeds)):\n    for j in range(i+1, min(20, n_seeds)):\n        r, _ = spearmanr(dim_var_mat[i], dim_var_mat[j])\n        var_corrs.append(r)\nprint(f\"  维度重要性(方差)的跨seed Spearman秩相关 (前20个seed): mean={np.mean(var_corrs):.4f}, std={np.std(var_corrs):.4f}\")\nprint(f\"   → 接近1表示所有seed关注相同维度, 接近0表示完全不同的维度模式\")\n\n# Also check mean profiles\ndim_mean_mat = np.zeros((n_seeds, D))\nfor i, sid in enumerate(seeds):\n    dim_mean_mat[i] = np.mean(sampled_data[sid], axis=0)\nmean_corrs = []\nfor i in range(min(20, n_seeds)):\n    for j in range(i+1, min(20, n_seeds)):\n        r, _ = spearmanr(dim_mean_mat[i], dim_mean_mat[j])\n        mean_corrs.append(r)\nprint(f\"  维度均值模式的跨seed Spearman秩相关: mean={np.mean(mean_corrs):.4f}, std={np.std(mean_corrs):.4f}\")\n\n# 3. Check: effective rank & intrinsic dimensionality\nprint(\"\\n=== 本征维度分析 (Intrinsic Dimensionality) ===\")\nfor sid in [seeds[0], seeds[1], seeds[5], seeds[-1]]:\n    x = sampled_data[sid]\n    x_centered = x - x.mean(axis=0, keepdims=True)\n    # Use randomized SVD for speed\n    U, S, Vt = np.linalg.svd(x_centered, full_matrices=False)\n    cum_var = np.cumsum(S**2) / (S**2).sum()\n    \n    dims_50 = int(np.searchsorted(cum_var, 0.50))\n    dims_90 = int(np.searchsorted(cum_var, 0.90))\n    dims_95 = int(np.searchsorted(cum_var, 0.95))\n    dims_99 = int(np.searchsorted(cum_var, 0.99))\n    \n    # Effective rank (entropy-based)\n    sv_norm = (S**2) / (S**2).sum()\n    eff_rank = np.exp(-np.sum(sv_norm * np.log(sv_norm + 1e-30)))\n    \n    print(f\"  seed{sid}: 50%={dims_50}, 90%={dims_90}, 95%={dims_95}, 99%={dims_99}, eff_rank={eff_rank:.1f}\")\n\n# 4. Check: are the codewords just noise or have structure?\n# For each seed, compare real data to shuffled (destroy correlations)\nprint(\"\\n=== 码字结构检验 (Does codeword space have structure?) ===\")\nsid = seeds[0]\nx = sampled_data[sid]\n# Shuffle each column independently\nx_shuf = x.copy()\nfor d in range(D):\n    np.random.shuffle(x_shuf[:, d])\n\n# Compare SVD spectra\nU, S, _ = np.linalg.svd(x - x.mean(axis=0, keepdims=True), full_matrices=False)\nU_shuf, S_shuf, _ = np.linalg.svd(x_shuf - x_shuf.mean(axis=0, keepdims=True), full_matrices=False)\n\nS_ratio = S / S_shuf\nprint(f\"  seed{sid}: 真实数据 vs 独立洗牌 的奇异值比值:\")\nprint(f\"    前10奇异值比值: {np.round(S_ratio[:10], 3)}\")\nprint(f\"    所有奇异值比值均值: {np.mean(S_ratio):.3f}\")\nprint(f\"    真实数据前10奇异值解释方差: {(S[:10]**2).sum()/(S**2).sum()*100:.2f}%\")\nprint(f\"    洗牌数据前10奇异值解释方差: {(S_shuf[:10]**2).sum()/(S_shuf**2).sum()*100:.2f}%\")\n\n# 5. Cross-seed distance distribution for individual samples\nprint(\"\\n=== 样本级跨seed距离分析 ===\")\nsid_a, sid_b = seeds[0], seeds[1]\nxa = sampled_data[sid_a][:2000]\nxb = sampled_data[sid_b][:2000]\n\n# Within-seed: distances between samples from same seed\nwithin_dists = np.linalg.norm(xa[:1000] - xa[1000:2000], axis=1)\n\n# Cross-seed: distances between samples from different seeds\ncross_dists = np.linalg.norm(xa[:1000] - xb[:1000], axis=1)\n\nprint(f\"  seed{sid_a} 内部样本距离: mean={within_dists.mean():.4f}, std={within_dists.std():.4f}\")\nprint(f\"  seed{sid_a}↔seed{sid_b} 跨seed样本距离: mean={cross_dists.mean():.4f}, std={cross_dists.std():.4f}\")\nprint(f\"  跨seed/内部距离比率: {cross_dists.mean()/within_dists.mean():.4f}\")\n\nPYEOF)", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 << 'PYEOF'\nimport torch\nimport numpy as np\nimport os\n\nBASE = \"exps/COST2100/in\"\nseed_dirs = sorted([d for d in os.listdir(BASE) if d.startswith(\"seed\")])\nseeds = [d.replace(\"seed\",\"\") for d in seed_dirs]\nn_seeds = len(seeds)\n\nSAMPLE = 5000\nN = 100000\nD = 512\n\n# Load all seed centroids and a few full datasets\ncentroids = np.zeros((n_seeds, D))\nnp.random.seed(42)\nsampled = {}\n\nfor i, sid in enumerate(seeds):\n    x = torch.load(f\"{BASE}/seed{sid}/transnet_hybrid/codewords/train_code.pt\", weights_only=True).float().numpy()\n    centroids[i] = x.mean(axis=0)\n    idx = np.random.choice(N, SAMPLE, replace=False)\n    sampled[sid] = x[idx]\n\n# ---- 1. Deeper: what does the linear map between seeds look like? ----\nprint(\"=== 跨seed映射矩阵分析 ===\")\nref_sid = seeds[0]\nref = sampled[ref_sid]\n\n# Compute W for seed0 -> seed42\ntsid = seeds[42]  # 42 is an actual seed\ntgt = sampled[tsid]\n\nlam = 1e-3\nW = np.linalg.solve(ref.T @ ref + lam * np.eye(D), ref.T @ tgt)\n# W maps seed0 space -> seed42 space\n\n# Analyze W\nUw, Sw, Vtw = np.linalg.svd(W)\nprint(f\"  W singular values: min={Sw.min():.4f}, max={Sw.max():.4f}, mean={Sw.mean():.4f}, median={np.median(Sw):.4f}\")\nprint(f\"  W condition number: {Sw.max()/(Sw.min()+1e-12):.2f}\")\nprint(f\"  W rank (sv>1e-3): {(Sw>1e-3).sum()} / {D}\")\n\n# Reconstruction with truncated SVD of W\nfor k in [10, 50, 100, 200, 300, 512]:\n    Uk = Uw[:, :k]\n    Sk = Sw[:k]\n    Vtk = Vtw[:k, :]\n    Wk = Uk @ np.diag(Sk) @ Vtk\n    pred = ref @ Wk\n    r2 = 1 - np.mean((pred - tgt)**2) / np.var(tgt)\n    print(f\"    W rank-{k} approx R2: {r2:.4f}\")\n\n# ---- 2. Visualize PCA projections ----\nfrom sklearn.decomposition import PCA\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\n\n# 2a. PCA on pooled data colored by seed\npooled = np.concatenate([sampled[s] for s in seeds[:8]], axis=0)  # 8 seeds x 5000\nlabels = np.repeat(np.arange(8), SAMPLE)\n\npca = PCA(n_components=2)\npooled_pca = pca.fit_transform(pooled - pooled.mean(axis=0))\n\ncolors = plt.cm.tab10(np.arange(8))\nfig, axes = plt.subplots(1, 2, figsize=(14, 6))\n\nfor i in range(8):\n    mask = labels == i\n    axes[0].scatter(pooled_pca[mask,0], pooled_pca[mask,1], c=[colors[i]], s=1, alpha=0.5, label=f'seed{seeds[i]}', rasterized=True)\naxes[0].set_title(f'PCA: 8 seeds pooled (explained var: {pca.explained_variance_ratio_[0]:.2%}, {pca.explained_variance_ratio_[1]:.2%})')\naxes[0].legend(markerscale=5)\n\n# 2b. PCA per seed and overlay\nfor i in range(8):\n    pca_i = PCA(n_components=2)\n    xi_pca = pca_i.fit_transform(sampled[seeds[i]] - sampled[seeds[i]].mean(axis=0))\n    axes[1].scatter(xi_pca[:500,0], xi_pca[:500,1], c=[colors[i]], s=1, alpha=0.5, label=f'seed{seeds[i]}', rasterized=True)\naxes[1].set_title(f'PCA per seed (first 500 samples)')\naxes[1].legend(markerscale=5)\n\nplt.tight_layout()\nplt.savefig('codeword_pca_8seeds.png', dpi=150)\nprint(f\"\\nSaved PCA visualization\")\n\n# ---- 3. KNN test: cross-seed nearest neighbors ----\nprint(\"\\n=== 跨seed最近邻测试 ===\")\n# From seedA samples, find nearest neighbors in seedA vs seedB\nsid_a, sid_b = seeds[0], seeds[1]\nxa = sampled[sid_a][:1000]  # [1000, 512]\nxb = sampled[sid_b][:1000]\n\n# Normalize by norm\nxa_n = xa / (np.linalg.norm(xa, axis=1, keepdims=True) + 1e-12)\nxb_n = xb / (np.linalg.norm(xb, axis=1, keepdims=True) + 1e-12)\n\n# For each sample in seedA, find its nearest neighbor in seedA vs seedB\nsim_within = xa_n @ xa_n.T  # [1000, 1000]\nsim_cross = xa_n @ xb_n.T  # [1000, 1000]\n\n# Set diagonal to 0 for within\nnp.fill_diagonal(sim_within, -1)\nmax_within = sim_within.max(axis=1)\nmax_cross = sim_cross.max(axis=1)\n\nprint(f\"  seed{sid_a}内部最大cosine: mean={max_within.mean():.4f}, std={max_within.std():.4f}\")\nprint(f\"  seed{sid_a}→seed{sid_b}最大cosine: mean={max_cross.mean():.4f}, std={max_cross.std():.4f}\")\nprint(f\"  cross/within比率: {max_cross.mean()/max_within.mean():.4f}\")\n\n# What fraction of samples have a closer neighbor in the other seed?\ncloser_cross = (max_cross > max_within).mean()\nprint(f\"  跨seed最近邻更近的比例: {closer_cross:.2%}\")\n\n# ---- 4. Procrustes analysis: optimal rotation/scaling between seeds ----\nprint(\"\\n=== Procrustes分析 ===\")\n# Use 500 samples from each seed, find optimal rotation\nxa_sub = sampled[sid_a][:500].copy()\nxb_sub = sampled[sid_b][:500].copy()\n\n# Center\nxa_c = xa_sub - xa_sub.mean(axis=0)\nxb_c = xb_sub - xb_sub.mean(axis=0)\n\n# Normalize scale\nsa = np.linalg.norm(xa_c)\nsb = np.linalg.norm(xb_c)\nxa_norm = xa_c / sa * np.sqrt(sa * sb)  # geometric mean scaling\nxb_norm = xb_c\n\n# Optimal rotation: M = Xa^T Xb\nM = xa_norm.T @ xb_norm\nU, S, Vt = np.linalg.svd(M)\nR = U @ Vt  # optimal rotation\n\n# Apply rotation\nxa_rotated = xa_norm @ R\n\n# Residual after Procrustes\nresidual = np.mean((xa_rotated - xb_norm)**2)\noriginal_mse = np.mean((xa_norm - xb_norm)**2)\nprint(f\"  Procrustes前MSE: {original_mse:.6f}\")\nprint(f\"  Procrustes后MSE: {residual:.6f}\")\nprint(f\"  对齐后R2: {1 - residual/original_mse:.4f}\")\nprint(f\"  Procrustes奇异值(对齐后的相似性): {np.round(S[:10], 4)}\")\nprint(f\"  所有奇异值接近1表示两个子空间本质相同(仅旋转), 接近0表示正交\")\n\n# ---- 5. Test: can a simple MLP align codewords? ----\nfrom sklearn.neural_network import MLPRegressor\nprint(\"\\n=== 非线性对齐测试 (MLP) ===\")\nxa_train = sampled[seeds[0]][:4000]\nxa_val = sampled[seeds[0]][4000:5000]\nxb_train = sampled[seeds[1]][:4000]\nxb_val = sampled[seeds[1]][4000:5000]\n\nmlp = MLPRegressor(hidden_layer_sizes=(256, 128), max_iter=100, random_state=42, verbose=False)\nmlp.fit(xa_train, xb_train)\n\npred_val = mlp.predict(xa_val)\nr2_val = 1 - np.mean((pred_val - xb_val)**2) / np.var(xb_val)\nprint(f\"  MLP (256-128) 跨seed迁移 R2_val: {r2_val:.4f}\")\n\n# Compare: same seed train/val\nmlp_same = MLPRegressor(hidden_layer_sizes=(256, 128), max_iter=100, random_state=42, verbose=False)\nmlp_same.fit(xa_train, xa_train)\npred_same = mlp_same.predict(xa_val)\nr2_same = 1 - np.mean((pred_same - xa_val)**2) / np.var(xa_val)\nprint(f\"  MLP 同seed自重建 R2_val: {r2_same:.4f}\")\n\nPYEOF)", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 << 'PYEOF'\nimport torch\nimport numpy as np\nimport os\nfrom sklearn.decomposition import PCA\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\n\nBASE = \"exps/COST2100/in\"\nseed_dirs = sorted([d for d in os.listdir(BASE) if d.startswith(\"seed\")])\nseeds = [d.replace(\"seed\",\"\") for d in seed_dirs]\nn_seeds = len(seeds)\n\nSAMPLE = 5000\nN = 100000\nD = 512\n\nnp.random.seed(42)\nsampled = {}\nfor sid in seeds:\n    x = torch.load(f\"{BASE}/seed{sid}/transnet_hybrid/codewords/train_code.pt\", weights_only=True).float().numpy()\n    idx = np.random.choice(N, SAMPLE, replace=False)\n    sampled[sid] = x[idx]\n\n# ---- 1. PCA visualization ----\nprint(\"=== PCA 可视化 ===\")\n# Pool 6 seeds\nn_viz = 6\npooled = np.concatenate([sampled[seeds[i]] for i in range(n_viz)], axis=0)\nlabels = np.repeat(np.arange(n_viz), SAMPLE)\n\npca = PCA(n_components=2)\npooled_pca = pca.fit_transform(pooled - pooled.mean(axis=0))\n\ncolors = plt.cm.tab10(np.arange(n_viz))\nfig, axes = plt.subplots(1, 2, figsize=(16, 6))\n\nfor i in range(n_viz):\n    mask = labels == i\n    axes[0].scatter(pooled_pca[mask,0], pooled_pca[mask,1], c=[colors[i]], s=2, alpha=0.4, label=f'seed{seeds[i]}', rasterized=True)\naxes[0].set_title(f'PCA: {n_viz} seeds pooled\\n(var: {pca.explained_variance_ratio_[0]:.2%}, {pca.explained_variance_ratio_[1]:.2%})')\naxes[0].legend(markerscale=5, fontsize=8)\n\n# Per-seed PCA, overlay\nfor i in range(n_viz):\n    pca_i = PCA(n_components=2)\n    xi = sampled[seeds[i]] - sampled[seeds[i]].mean(axis=0)\n    xi_pca = pca_i.fit_transform(xi)\n    axes[1].scatter(xi_pca[:500,0], xi_pca[:500,1], c=[colors[i]], s=2, alpha=0.5, label=f'seed{seeds[i]}', rasterized=True)\naxes[1].set_title('PCA per seed (first 500 samples each)')\naxes[1].legend(markerscale=5, fontsize=8)\n\nplt.tight_layout()\nplt.savefig('codeword_pca_6seeds.png', dpi=150, bbox_inches='tight')\nprint(\"  Saved PCA figure.\")\n\n# ---- 2. Procrustes analysis ----\nprint(\"\\n=== Procrustes分析 ===\")\nsid_a, sid_b = seeds[0], seeds[1]\nxa = sampled[sid_a][:1000].copy()\nxb = sampled[sid_b][:1000].copy()\n\nxa_c = xa - xa.mean(axis=0)\nxb_c = xb - xb.mean(axis=0)\n\nM = xa_c.T @ xb_c\nU, S, Vt = np.linalg.svd(M)\nR = U @ Vt\n\nxa_aligned = xa_c @ R\nmse_before = np.mean((xa_c - xb_c)**2)\nmse_after = np.mean((xa_aligned - xb_c)**2)\nr2_proc = 1 - mse_after / mse_before\nprint(f\"  Procrustes前MSE: {mse_before:.4f}\")\nprint(f\"  Procrustes后MSE: {mse_after:.4f}\")\nprint(f\"  R2 after alignment: {r2_proc:.4f}\")\nprint(f\"  前10个Procrustes奇异值: {np.round(S[:10], 4)}\")\nprint(f\"  后10个奇异值: {np.round(S[-10:], 4)}\")\nprint(f\"  所有奇异值范围: [{S.min():.4f}, {S.max():.4f}]\")\n\n# ---- 3. Analyze mapping matrix W between seeds ----\nprint(\"\\n=== 映射矩阵W分析 (seed0 -> seed42) ===\")\nref = sampled[seeds[0]][:2000]\ntgt = sampled[seeds[42]][:2000]\n\nlam = 1e-3\nW = np.linalg.solve(ref.T @ ref + lam * np.eye(D), ref.T @ tgt)\nUw, Sw, Vtw = np.linalg.svd(W)\nprint(f\"  W奇异值: min={Sw.min():.4f}, max={Sw.max():.4f}, median={np.median(Sw):.4f}, mean={Sw.mean():.4f}\")\nprint(f\"  W条件数: {Sw.max()/(Sw.min()+1e-12):.2f}\")\n\n# Test truncated reconstruction\npred_full = ref @ W\nr2_full = 1 - np.mean((pred_full - tgt)**2) / np.var(tgt)\nprint(f\"  完整映射R2: {r2_full:.4f}\")\n\nfor k in [10, 30, 50, 100, 200]:\n    Uk = Uw[:, :k]\n    Sk = Sw[:k]\n    Vtk = Vtw[:k, :]\n    Wk = Uk @ np.diag(Sk) @ Vtk\n    pred = ref @ Wk\n    r2 = 1 - np.mean((pred - tgt)**2) / np.var(tgt)\n    print(f\"  截断rank-{k}: R2={r2:.4f}\")\n\n# ---- 4. Histogram of correlation between same dim across seeds ----\nprint(\"\\n=== 跨seed维度相关性分析 ===\")\n# For each dimension, compute correlation of that dim's values between seed0 and seed42\nxa = sampled[seeds[0]]\nxb = sampled[seeds[42]]\n\ndim_corrs = np.zeros(D)\nfor d in range(D):\n    dim_corrs[d] = np.corrcoef(xa[:, d], xb[:, d])[0, 1]\n\nprint(f\"  维度级相关性: mean={dim_corrs.mean():.4f}, std={dim_corrs.std():.4f}\")\nprint(f\"  相关性>0.1的维度比例: {(dim_corrs>0.1).mean():.2%}\")\nprint(f\"  相关性>0.3的维度比例: {(dim_corrs>0.3).mean():.2%}\")\nprint(f\"  相关性>0.5的维度比例: {(dim_corrs>0.5).mean():.2%}\")\n\n# ---- 5. Visualization of distribution differences ----\nfig, axes = plt.subplots(2, 3, figsize=(15, 8))\n\n# Show 6 dimensions' distributions for seed0 vs seed42\nfor idx, d in enumerate([0, 50, 100, 200, 300, 400]):\n    ax = axes[idx//3, idx%3]\n    ax.hist(xa[:2000, d], bins=50, alpha=0.5, label=f'seed{seeds[0]}', density=True)\n    ax.hist(xb[:2000, d], bins=50, alpha=0.5, label=f'seed{seeds[42]}', density=True)\n    ax.set_title(f'dim {d} (corr={dim_corrs[d]:.3f})')\n    ax.legend(fontsize=8)\n\nplt.tight_layout()\nplt.savefig('codeword_dim_distributions.png', dpi=150, bbox_inches='tight')\nprint(\"  Saved distribution figure.\")\n\n# ---- 6. Does translation help? Compare centroids ----\nprint(\"\\n=== 质心去中心化分析 ===\")\nxa_c = xa - xa.mean(axis=0)\nxb_c = xb - xb.mean(axis=0)\n# After translation\nmse_centered = np.mean((xa_c - xb_c)**2)\nmse_raw = np.mean((xa - xb)**2)\nprint(f\"  去中心前后MSE: {mse_raw:.4f} -> {mse_centered:.4f} (improvement={1-mse_centered/mse_raw:.2%})\")\n\n# ---- 7. All-against-all centroid similarity matrix (heatmap) ----\nprint(\"\\n=== 计算全质心相似度矩阵... ===\")\ncentroids = np.zeros((n_seeds, D))\nfor i, sid in enumerate(seeds):\n    centroids[i] = sampled[sid].mean(axis=0)\n\ncn = centroids / (np.linalg.norm(centroids, axis=1, keepdims=True) + 1e-12)\ncos_mat = cn @ cn.T\n\nfig, ax = plt.subplots(figsize=(10, 9))\nim = ax.imshow(cos_mat, cmap='RdBu_r', vmin=-0.25, vmax=0.25)\nplt.colorbar(im, ax=ax, label='Cosine Similarity')\nax.set_title(f'{n_seeds} seeds: centroid cosine similarity matrix')\nax.set_xlabel('Seed index')\nax.set_ylabel('Seed index')\nplt.tight_layout()\nplt.savefig('centroid_similarity_matrix.png', dpi=150, bbox_inches='tight')\nprint(\"  Saved centroid similarity heatmap.\")\n\nprint(\"\\n=== 分析完成 ===\")\nPYEOF)", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 << 'PYEOF'\nimport torch\nimport numpy as np\nimport os\nfrom sklearn.decomposition import PCA\n\nBASE = \"exps/COST2100/in\"\nseed_dirs = sorted([d for d in os.listdir(BASE) if d.startswith(\"seed\")])\nseeds = [d.replace(\"seed\",\"\") for d in seed_dirs]\n\nSAMPLE = 5000\nN = 100000\nD = 512\n\nnp.random.seed(42)\nsampled = {}\nfor sid in seeds:\n    x = torch.load(f\"{BASE}/seed{sid}/transnet_hybrid/codewords/train_code.pt\", weights_only=True).float().numpy()\n    idx = np.random.choice(N, SAMPLE, replace=False)\n    sampled[sid] = x[idx]\n\n# ---- 1. Compute pairwise principal angles between ALL seeds ----\nprint(\"=== 所有seed间主角度统计 (前20个seed) ===\")\nn_pa = min(20, len(seeds))\nfrom scipy.linalg import svd as sp_svd\n\n# For efficiency, use top 50 PCA components per seed\npca_models = {}\nfor sid in seeds[:n_pa]:\n    pca = PCA(n_components=50)\n    pca.fit(sampled[sid])\n    pca_models[sid] = pca.components_.T  # [512, 50]\n\nall_min_angles = []\nall_mean_angles = []\n\nfor i in range(n_pa):\n    for j in range(i+1, n_pa):\n        A = pca_models[seeds[i]]\n        B = pca_models[seeds[j]]\n        # Canonical correlations via SVD of A^T B\n        U, S, Vt = sp_svd(A.T @ B, full_matrices=False)\n        angles = np.arccos(np.clip(S, -1, 1))\n        all_min_angles.append(angles[0])\n        all_mean_angles.append(np.mean(angles))\n\nprint(f\"  最小主角度: min={np.degrees(min(all_min_angles)):.2f}°, max={np.degrees(max(all_min_angles)):.2f}°, mean={np.degrees(np.mean(all_min_angles)):.2f}°\")\nprint(f\"  平均主角度: min={np.degrees(min(all_mean_angles)):.2f}°, max={np.degrees(max(all_mean_angles)):.2f}°, mean={np.degrees(np.mean(all_mean_angles)):.2f}°\")\n\n# For high-D random subspaces, expected angle = 90°. Our results show ~55-75°, \n# meaning these subspaces are far from aligned.\n\n# ---- 2. Check: does removing centroid help subspace alignment? ----\nprint(\"\\n=== 去质心后的子空间对齐 ===\")\nsid0, sid1 = seeds[0], seeds[1]\nx0 = sampled[sid0] - sampled[sid0].mean(axis=0)\nx1 = sampled[sid1] - sampled[sid1].mean(axis=0)\n\npca0 = PCA(n_components=50).fit(x0)\npca1 = PCA(n_components=50).fit(x1)\nA = pca0.components_.T\nB = pca1.components_.T\nU, S, Vt = sp_svd(A.T @ B, full_matrices=False)\nangles = np.arccos(np.clip(S, -1, 1))\nprint(f\"  去质心后主角度: mean={np.degrees(np.mean(angles)):.2f}°, min={np.degrees(angles[0]):.2f}°\")\nprint(f\"  去质心后前10个主角度: {np.round(np.degrees(angles[:10]), 2)}°\")\n\n# ---- 3. What's the overlap of the top PCA directions? ----\nprint(f\"\\n=== PCA方向相关性 ===\")\n# For the first 20 seeds, compute the top 5 PCA directions and check alignment\ntopk = 5\nall_top_pcs = np.zeros((n_pa, D, topk))\nfor i, sid in enumerate(seeds[:n_pa]):\n    pca = PCA(n_components=topk)\n    pca.fit(sampled[sid] - sampled[sid].mean(axis=0))\n    all_top_pcs[i] = pca.components_  # [topk, D]\n\n# Between any two seeds, how aligned are the top PCs?\nalignments = []\nfor i in range(n_pa):\n    for j in range(i+1, n_pa):\n        # Cosine similarity between PCs (absolute)\n        cos_mat = np.abs(all_top_pcs[i] @ all_top_pcs[j].T)  # [topk, topk]\n        alignments.append(cos_mat.max())\n        \nprint(f\"  Top-5 PC方向最大对齐度: mean={np.mean(alignments):.4f}, max={np.max(alignments):.4f}\")\nprint(f\"  随机期望值(5D subspaces in 512D): ~0.01\")\n# For random 5D subspaces in 512D, the expected max cosine is ~sqrt(5/512)*something ≈ 0.1\n\n# ---- 4. Check: is the within-seed structure the same? ----\n# Compare the eigenvalue spectrum shape\nprint(\"\\n=== 本征谱形状对比 ===\")\nev_spectra = []\nfor sid in seeds[:10]:\n    x = sampled[sid] - sampled[sid].mean(axis=0)\n    _, S, _ = np.linalg.svd(x, full_matrices=False)\n    ev_spectra.append(S[:100])\n\nev_spectra = np.array(ev_spectra)\n# Correlation of eigenvalue spectra\nspec_corrs = np.corrcoef(ev_spectra)\noff_diag = spec_corrs[np.triu_indices_from(spec_corrs, 1)]\nprint(f\"  前10个seed的特征值谱相关系数: mean={off_diag.mean():.4f}, std={off_diag.std():.4f}\")\nprint(f\"   → 接近1说明本征结构一致,接近0说明完全不同\")\n\n# Normalized spectrum comparison\nfig, ax = plt.subplots(1, 1, figsize=(10, 6))\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\n\nfor sid in seeds[:8]:\n    x = sampled[sid] - sampled[sid].mean(axis=0)\n    _, S, _ = np.linalg.svd(x, full_matrices=False)\n    cum_var = np.cumsum(S**2) / (S**2).sum()\n    ax.plot(range(1, 101), cum_var[:100], label=f'seed{sid}')\nax.set_xlabel('Number of components')\nax.set_ylabel('Cumulative variance explained')\nax.set_title('Eigenvalue spectrum comparison across seeds')\nax.legend(fontsize=8)\nax.grid(True, alpha=0.3)\nplt.tight_layout()\nplt.savefig('eigenvalue_spectra_comparison.png', dpi=150, bbox_inches='tight')\nprint(\"  Saved eigenvalue spectra comparison.\")\n\n# ---- 5. Actually test cross-decoding: encoder A + decoder B ----\n# To confirm: we need to test whether seedA encoder's output in seedB's decoder\n# Since we don't have the actual models, let's use the statistical approach:\n# If we can't even align the distributions, decoding will fail.\n\nprint(\"\\n=== 关键总结统计 ===\")\nprint(\"  1. 维度相关性: ~0 (每个seed的相同维度编码完全不同信息)\")\nprint(\"  2. 质心cosine相似度: ~0 (质心方向几乎正交)\")\nprint(\"  3. 主角度: ~74° (子空间几乎正交)\")\nprint(\"  4. Procrustes R² = 0.36 (最优旋转后仍只能对齐36%方差)\")\nprint(\"  5. 线性映射R² = 0.71, 但条件数64M (病态,无法实用)\")\nprint(\"  6. 特征值谱形状: 高相关 (本征复杂度一致)\")\nprint(\"  7. 72%方差来自seed间差异\")\n\nPYEOF)", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 << 'PYEOF'\nimport torch\nimport numpy as np\nimport os\nimport matplotlib\nmatplotlib.use('Agg')\nimport matplotlib.pyplot as plt\n\nBASE = \"exps/COST2100/in\"\nseed_dirs = sorted([d for d in os.listdir(BASE) if d.startswith(\"seed\")])\nseeds = [d.replace(\"seed\",\"\") for d in seed_dirs]\n\nSAMPLE = 5000\nN = 100000\nD = 512\n\nnp.random.seed(42)\nsampled = {}\nfor sid in seeds:\n    x = torch.load(f\"{BASE}/seed{sid}/transnet_hybrid/codewords/train_code.pt\", weights_only=True).float().numpy()\n    idx = np.random.choice(N, SAMPLE, replace=False)\n    sampled[sid] = x[idx]\n\n# Eigenvalue spectrum comparison\nfig, ax = plt.subplots(1, 1, figsize=(10, 6))\nspec_corrs_list = []\n\nfor i, sid in enumerate(seeds[:10]):\n    x = sampled[sid] - sampled[sid].mean(axis=0)\n    _, S, _ = np.linalg.svd(x, full_matrices=False)\n    cum_var = np.cumsum(S**2) / (S**2).sum()\n    ax.plot(range(1, 101), cum_var[:100], label=f'seed{sid}')\n    spec_corrs_list.append(S[:100])\n\n# Correlation of eigenvalue spectra\nspec_corrs = np.corrcoef(spec_corrs_list)\noff_diag = spec_corrs[np.triu_indices_from(spec_corrs, 1)]\nprint(f\"前10个seed的特征值谱相关系数: mean={off_diag.mean():.4f}, std={off_diag.std():.4f}\")\n\nax.set_xlabel('Number of components')\nax.set_ylabel('Cumulative variance explained')\nax.set_title('Eigenvalue spectrum comparison across seeds')\nax.legend(fontsize=8)\nax.grid(True, alpha=0.3)\nplt.tight_layout()\nplt.savefig('eigenvalue_spectra_comparison.png', dpi=150, bbox_inches='tight')\nprint(\"Saved eigenvalue spectra comparison.\")\n\n# PCA visualization with more seeds\nn_viz = 8\nfrom sklearn.decomposition import PCA\npooled = np.concatenate([sampled[seeds[i]] for i in range(n_viz)], axis=0)\nlabels = np.repeat(np.arange(n_viz), SAMPLE)\n\npca = PCA(n_components=2)\npooled_pca = pca.fit_transform(pooled - pooled.mean(axis=0))\n\ncolors = plt.cm.tab10(np.arange(n_viz))\nfig, axes = plt.subplots(1, 2, figsize=(16, 6))\n\nfor i in range(n_viz):\n    mask = labels == i\n    axes[0].scatter(pooled_pca[mask,0], pooled_pca[mask,1], c=[colors[i]], s=2, alpha=0.4, label=f'seed{seeds[i]}', rasterized=True)\naxes[0].set_title(f'PCA: {n_viz} seeds pooled\\n(var: {pca.explained_variance_ratio_[0]:.2%}, {pca.explained_variance_ratio_[1]:.2%})')\naxes[0].legend(markerscale=5, fontsize=8)\n\nfor i in range(n_viz):\n    pca_i = PCA(n_components=2)\n    xi = sampled[seeds[i]] - sampled[seeds[i]].mean(axis=0)\n    xi_pca = pca_i.fit_transform(xi)\n    axes[1].scatter(xi_pca[:500,0], xi_pca[:500,1], c=[colors[i]], s=2, alpha=0.5, label=f'seed{seeds[i]}', rasterized=True)\naxes[1].set_title('PCA per seed (first 500 samples each)')\naxes[1].legend(markerscale=5, fontsize=8)\n\nplt.tight_layout()\nplt.savefig('codeword_pca_8seeds_v2.png', dpi=150, bbox_inches='tight')\nprint(\"Saved PCA figure v2.\")\n\nprint(\"\\n所有分析就绪，准备写入报告。\")\nPYEOF)", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 << 'PYEOF'\nimport torch\nimport numpy as np\nimport os\n\nBASE = \"exps/COST2100/in\"\nseed_dirs = sorted([d for d in os.listdir(BASE) if d.startswith(\"seed\")])\nseeds = [d.replace(\"seed\",\"\") for d in seed_dirs]\n\n# The files all have 100000 samples. If the data loader is deterministic,\n# the i-th sample in each codeword file corresponds to the same CSI input.\n# Let's check correlation for SAME sample index across seeds\nsid_a, sid_b = seeds[0], seeds[1]\nxa = torch.load(f\"{BASE}/seed{sid_a}/transnet_hybrid/codewords/train_code.pt\", weights_only=True).float().numpy()\nxb = torch.load(f\"{BASE}/seed{sid_b}/transnet_hybrid/codewords/train_code.pt\", weights_only=True).float().numpy()\n\n# Check: for 100 samples, what's the correlation for the same sample index?\nnp.random.seed(42)\nsample_indices = np.random.choice(100000, 100, replace=False)\npairwise_corrs = []\nfor idx in sample_indices:\n    c = np.corrcoef(xa[idx], xb[idx])[0,1]\n    pairwise_corrs.append(c)\n\nprint(\"=== 同样本索引跨seed相关性 ===\")\nprint(f\"  mean={np.mean(pairwise_corrs):.4f}, std={np.std(pairwise_corrs):.4f}\")\nprint(f\"  max={np.max(pairwise_corrs):.4f}, min={np.min(pairwise_corrs):.4f}\")\n\n# Same input -> same sample index, so we can also compute cosine similarity\ncos_sims = []\nfor idx in sample_indices[:1000]:\n    a = xa[idx] / (np.linalg.norm(xa[idx]) + 1e-12)\n    b = xb[idx] / (np.linalg.norm(xb[idx]) + 1e-12)\n    cos_sims.append(a @ b)\nprint(f\"\\n  同样本cosine相似度: mean={np.mean(cos_sims):.4f}, std={np.std(cos_sims):.4f}\")\n\n# L2 distance for same input across seeds\nl2_dists = np.linalg.norm(xa[:1000] - xb[:1000], axis=1)\nprint(f\"  同样本L2距离: mean={l2_dists.mean():.4f}, std={l2_dists.std():.4f}\")\n\n# Compare: same input, different seed vs different input, same seed\nsame_input_cross_seed = l2_dists\ndiff_input_same_seed = np.linalg.norm(xa[:1000] - xa[1000:2000], axis=1)\nprint(f\"  不同输入同seed L2: mean={diff_input_same_seed.mean():.4f}\")\nprint(f\"  同输入跨seed / 不同输入同seed 比率: {same_input_cross_seed.mean()/diff_input_same_seed.mean():.2f}\")\n\n# Check: for a specific sample, visualize codeword pattern\nprint(\"\\n=== 特定样本的码字模式对比 ===\")\nfor idx in [0, 100, 500, 1000]:\n    a, b = 
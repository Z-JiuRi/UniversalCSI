s = [nmse for _, nmse in seeds_with_results]\nimport math\nnmses_dB = [10 * math.log10(v) if v > 0 else v for v in nmses]\n\nprint(f'NMSE linear range: [{min(nmses):.4e}, {max(nmses):.4e}]')\nprint(f'NMSE dB range:     [{min(nmses_dB):.2f}, {max(nmses_dB):.2f}] dB')\nprint(f'NMSE mean:         {sum(nmses)/len(nmses):.4e} ({10*math.log10(sum(nmses)/len(nmses)):.2f} dB)')\nprint(f'NMSE std:          {math.sqrt(sum((v - sum(nmses)/len(nmses))**2 for v in nmses)/(len(nmses)-1)):.4e}')\nprint()\n\n# Show all\nfor s, n in seeds_with_results:\n    print(f'seed={s:5d}  NMSE={n:.4e} ({10*math.log10(n):.2f} dB)')\n\")", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && head -5 exps/COST2100/in/seed42/transnet_hybrid/run.log | grep -i nmse; grep \"NMSE\" exps/COST2100/in/seed42/transnet_hybrid/run.log | tail -5)", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 -c \"\nimport os, re, glob, math\n\nbase = 'exps/COST2100/in'\n\n# Find all transnet_hybrid runs for multiple seeds\nseeds_with_results = []\nfor d in sorted(glob.glob(f'{base}/seed*/transnet_hybrid/run.log')):\n    seed_name = d.split('/')[-3]\n    seed_num = seed_name.replace('seed', '')\n    with open(d) as f:\n        content = f.read()\n    # NMSE in log is already in dB: e.g. -2.8407e+01 = -28.4 dB\n    m = re.search(r'=> Test NMSE: (-?\\d+\\.\\d+e[+-]?\\d+)', content)\n    if m:\n        nmse_db = float(m.group(1))\n        seeds_with_results.append((int(seed_num), nmse_db))\n\nprint(f'Found {len(seeds_with_results)} seeds with results for transnet_hybrid')\nseeds_with_results.sort()\nnmses_db = [nmse for _, nmse in seeds_with_results]\n\nprint(f'NMSE in dB:')\nprint(f'  Range:      [{min(nmses_db):.2f}, {max(nmses_db):.2f}] dB')\nprint(f'  Mean:       {sum(nmses_db)/len(nmses_db):.2f} dB')\nprint(f'  Std:        {math.sqrt(sum((v - sum(nmses_db)/len(nmses_db))**2 for v in nmses_db)/(len(nmses_db)-1)):.2f} dB')\nprint(f'  Max spread: {max(nmses_db) - min(nmses_db):.2f} dB')\nprint()\n\n# Show 
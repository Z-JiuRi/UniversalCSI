B) ===')\nfor k, v in sorted(experiments.items(), key=lambda x: x[1], reverse=True):\n    print(f'{k:45s} {v:.2f}')\n\")", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 -c \"\nimport os, glob, re\n\nbase = 'exps/COST2100/in'\n\n# frozen_decoder experiments\nprint('=== frozen_decoder experiments (NMSE in dB) ===')\nfor seed_dir in sorted(glob.glob(f'{base}/frozen_decoder/seed*/')):\n    seed = seed_dir.strip('/').split('/')[-1]\n    for exp_dir in sorted(glob.glob(f'{seed_dir}*/')):\n        name = exp_dir.strip('/').split('/')[-1]\n        log = os.path.join(exp_dir, 'run.log')\n        if os.path.exists(log):\n            with open(log) as f:\n                content = f.read()\n            m = re.search(r'=> Test NMSE: (-?\\d+\\.\\d+e[+-]?\\d+)', content)\n            if m:\n                nmse = float(m.group(1))\n                print(f'{seed:10s} {name:45s} {nmse:.2f}')\n\")", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 -c \"\nimport os, glob, re\n\nbase = 'exps/COST2100/in'\n\n# seed2026 and seed3407 non-frozen experiments\nfor seed_name in ['seed2026', 'seed3407']:\n    print(f'=== {seed_name} experiments ===')\n    for exp_dir in sorted(glob.glob(f'{base}/{seed_name}/*/')):\n        name = os.path.basename(os.path.dirname(exp_dir))\n        # Actually just use basename of exp_dir\n        exp_name = os.path.basename(exp_dir.rstrip('/'))\n        log = os.path.join(exp_dir, 'run.log')\n        if os.path.exists(log):\n            with open(log) as f:\n                content = f.read()\n            m = re.search(r'=> Test NMSE: (-?\\d+\\.\\d+e[+-]?\\d+)', content)\n            if m:\n                nmse = float(m.group(1))\n                print(f'{exp_name:45s} {nmse:.2f}')\n\")", "Bash(cd /storage/hujiacong/zxd/Huawei/UniversalCSI && python3 -c \"\nimport os, glob, re\n\nbase = 'exps/COST2100/in'\n\n# lora experiments\nprint('=== lora experiments (NMSE in dB) ===')\nfor seed_dir in sorted(glob.glob(f'{base}/lora/seed*/'
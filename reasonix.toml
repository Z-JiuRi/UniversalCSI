ort os, json\nfrom collections import OrderedDict\n\nBASE = \"exps/COST2100/in\"\nseeds = sorted([d.split(\"/\")[1] for d in os.listdir(BASE) if d.startswith(\"seed\")])\n\n# Load all codewords\ndata = {}\nfor s in seeds:\n    path = f\"{BASE}/{s}/transnet_hybrid/codewords/train_code.pt\"\n    data[s] = torch.load(path, weights_only=True).float().numpy()\n\nN, D = data[seeds[0]].shape\nn_seeds = len(seeds)\nprint(f\"Seeds: {n_seeds}, Samples: {N}, Dim: {D}\")\n\n# ---- 1. Basic statistics per seed ----\nstats = OrderedDict()\nfor s in seeds:\n    x = data[s]\n    stats[s] = {\n        \"mean\": float(x.mean()),\n        \"std\": float(x.std()),\n        \"min\": float(x.min()),\n        \"max\": float(x.max()),\n        \"median\": float(np.median(x)),\n        \"p1\": float(np.percentile(x, 1)),\n        \"p99\": float(np.percentile(x, 99)),\n        \"skew\": float(((x - x.mean())**3).mean() / (x.std()+1e-12)**3),\n        \"kurt\": float(((x - x.mean())**4).mean() / (x.std()+1e-12)**4 - 3),\n    }\n\n# Print summary across seeds\nprint(\"\\n=== Basic statistics across all seeds ===\")\nfor key in [\"mean\", \"std\", \"min\", \"max\", \"median\", \"skew\", \"kurt\"]:\n    vals = [stats[s][key] for s in seeds]\n    print(f\"  {key}: min={min(vals):.6f}, max={max(vals):.6f}, mean={np.mean(vals):.6f}, std={np.std(vals):.6f}\")\n\n# ---- 2. Per-dimension statistics (pooled across seeds) ----\nprint(\"\\n=== Per-dimension statistics (over all seeds) ===\")\nall_data = np.stack([data[s] for s in seeds], axis=0)  # [n_seeds, N, D]\ndim_means = all_data.mean(axis=(0,1))  # [D]\ndim_stds = all_data.std(axis=(0,1))    # [D]\nprint(f\"  dim means across D: min={dim_means.min():.6f}, max={dim_means.max():.6f}, mean={dim_means.mean():.6f}, std={dim_means.std():.6f}\")\nprint(f\"  dim stds across D:  min={dim_stds.min():.6f}, max={dim_stds.max():.6f}, mean={dim_stds.mean():.6f}, std={dim_stds.std():.6f}\")\n\n# ---- 3. Pairwise correlation between seed centroids ----\ncentroids = np.zeros((n_seeds, D))\nfor i, s in enumerate(seeds):\n    centroids[i] = data[s].mean(axis=0)  # centroid per seed\n\nprint(\"\\n=== Centroid analysis ===\")\ncentroid_norms = np.linalg.norm(centroids, axis=1)\nprint(f\"  Centroid norms: min={centroid_norms.min():.6f}, max={centroid_norms.max():.6f}, mean={centroid_norms.mean():.6f}\")\n\n# Pairwise centroid cosine similarity \ncentroid_normed = centroids / (np.linalg.norm(centroids, axis=1, keepdims=True) + 1e-12)\ncos_sim = centroid_normed @ centroid_normed.T\nprint(f\"  Pairwise centroid cosine sim: min={cos_sim.min():.6f}, max={cos_sim.max():.6f}, mean={cos_sim.mean():.6f}, median={np.median(cos_sim):.6f}\")\nprint(f\"  Off-diagonal cosine sim: min={cos_sim[np.triu_indices_from(cos_sim,1)].min():.6f}, mean={cos_sim[np.triu_indices_from(cos_sim,1)].mean():.6f}\")\n\n# Pairwise centroid Euclidean distance\ncentroid_dist = np.zeros((n_seeds, n_seeds))\nfor i in range(n_seeds):\n    for j in range(i+1, n_seeds):\n        d_ij = np.linalg.norm(centroids[i] - centroids[j])\n        centroid_dist[i,j] = centroid_dist[j,i] = d_ij\noff_diag_dist = centroid_dist[np.triu_indices_from(centroid_dist, 1)]\nprint(f\"  Pairwise centroid L2 dist: min={off_diag_dist.min():.6f}, max={off_diag_dist.max():.6f}, mean={off_diag_dist.mean():.6f}\")\n\n# ---- 4. Within-seed vs across-seed variance ----\n# Total variance decomposition\noverall_mean = all_data.mean(axis=(0,1), keepdims=True)  # [1, 1, D]\n# Between-seed: mean of each seed's centroid distance from overall mean\nbetween_var = ((centroids - overall_mean.squeeze())**2).sum() / n_seeds\n# Within-seed: average variance within each seed\nwithin_var = 0\nfor s in seeds:\n    within_var += ((data[s] - data[s].mean(axis=0, keepdims=True))**2).sum()\nwithin_var /= (n_seeds * N)\ntotal_var = ((all_data - overall_mean)**2).sum() / (n_seeds * N)\nprint(f\"\\n=== Variance decomposition ===\")\nprint(f\"  Total variance: {total_var:.6f}\")\nprint(f\"  Between-seed variance: {between_